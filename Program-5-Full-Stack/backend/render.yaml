services:
  - type: web
    name: college-event-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: college-events-db
          property: connectionString

databases:
  - name: college-events-db
    databaseName: college_events
    user: postgres
    plan: free
